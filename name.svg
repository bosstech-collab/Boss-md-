<svg width="500" height="120" viewBox="0 0 500 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');
    
    @keyframes glow {
      0% { filter: drop-shadow(0 0 8px #FF00FF) drop-shadow(0 0 12px #00FFFF); }
      50% { filter: drop-shadow(0 0 25px #FF00FF) drop-shadow(0 0 35px #00FFFF); }
      100% { filter: drop-shadow(0 0 8px #FF00FF) drop-shadow(0 0 12px #00FFFF); }
    }
    .boss-title {
      animation: glow 3s ease-in-out infinite;
      font-family: 'Arial Black', sans-serif; /* High compatibility bold font */
      font-weight: 900;
      font-size: 60px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
  
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" 
        class="boss-title" fill="url(#gradient)">
    USMAN MD
  </text>
  
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF00FF">
        <animate attributeName="stop-color" values="#FF00FF;#00FFFF;#FF00FF" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00FFFF">
        <animate attributeName="stop-color" values="#00FFFF;#FF00FF;#00FFFF" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF00FF">
        <animate attributeName="stop-color" values="#FF00FF;#00FFFF;#FF00FF" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
</svg>
